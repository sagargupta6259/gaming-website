<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sagar gaming zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1>🎮 Sagar Gaming Zone</h1>
    <ul>
        <li>Home</li>
        <li>Games</li>
        <li>Leaderboard</li>
        <li>Contact</li>
    </ul>
</nav>

<div class="container">

    <div class="sidebar">
        <h3>Game Info</h3>
        <p>🚀 Space Shooter</p>
        <p>🔥 Destroy enemies</p>
        <p>❤️ 3 Lives</p>
        <p>🏆 Increase Score</p>
    </div>

    <div class="main">

        <h2>Score: <span id="score">0</span></h2>
        <h3 id="lives">Lives: ❤️❤️❤️</h3>

        <div class="gameArea" id="gameArea">
            <div class="player" id="player"></div>
        </div>

        <div class="controls">
            <button onclick="moveLeft()">⬅ Left</button>
            <button onclick="shoot()">🔫 Shoot</button>
            <button onclick="moveRight()">Right ➡</button>
        </div>

        <button id="restartBtn" onclick="restartGame()">🔄 Restart</button>

    </div>

</div>

<footer>
    © 2026 Sagar Gupta | College Project
</footer>

<script src="script.js"></script>
</body>
</html>
